scenarios:
  - name: omnitrix-dial-rotate
    adapter: command
    args: >
      cargo run -p visual-snapshot --
      --example omnitrix --size 120x40
      --script .plumb/scripts/omnitrix-dial-rotate.json
      --out {out}.gif
    intent: >
      After boot clears, the Omnitrix settles on the Faceplate screen:
      three alien-mode labels (Brainstorm, Fasttrack, Upgrade) sit at
      fixed points around a dotted ring, with the currently selected
      label shown in inverse video next to a centre pointer glyph. As
      Tab is pressed, the highlighted label and pointer advance around
      the ring in order: Brainstorm, then Fasttrack, then Upgrade. The
      dashed green border and the "Tab/Shift+Tab cycle * Enter launch *
      q quit" hint bar stay visible throughout and are not tied to the
      selection.
    expects: []
    touches:
      - src/widgets/**
      - src/camera.rs
      - src/easing.rs
      - examples/omnitrix/**
  - name: tardis-console-idle
    adapter: command
    args: >
      cargo run -p visual-snapshot --
      --example tardis --size 120x40
      --script .plumb/scripts/tardis-console-idle.json
      --out {out}.gif
    intent: >
      The TARDIS finishes its materialization boot sequence and settles
      into the idle console hub. The time rotor rotates continuously in
      the centre of the display, the currently selected face's name is
      shown at the top, and the rotate/select/quit hint stays legible at
      the bottom throughout.
    expects: []
    touches:
      - src/widgets/**
      - src/canvas.rs
      - examples/tardis/**
  - name: falcon-glitch-burst
    adapter: command
    args: >
      cargo run -p visual-snapshot --
      --example falcon --size 120x40
      --script .plumb/scripts/falcon-glitch-burst.json
      --out {out}.gif
    intent: >
      Falcon boots, then percussive maintenance triggers a corruption
      burst across all three cockpit instrument panels. The panels are
      heavily garbled at the peak of the burst, then clear and settle
      back into a legible, running dashboard.
    expects:
      - visual-corruption
    touches:
      - src/glitch.rs
      - src/effects.rs
      - examples/falcon/**
