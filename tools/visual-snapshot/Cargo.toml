[package]
name = "visual-snapshot"
version = "0.1.0"
edition = "2021"

[dependencies]
ttui = { path = "../.." }
portable-pty = "0.9"
vt100 = "0.15"
image = "0.25"
font8x8 = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["gzip"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "echo_key"

[[example]]
name = "echo_mouse"

[[example]]
name = "echo_args"

[[example]]
name = "raw_mode_fixture"

[[example]]
name = "panic_hook_fixture"
