# Template GitHub Actions workflow — copy into .github/workflows/ci.yml
# once the core language is chosen and the Makefile targets are real.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO: add language toolchain setup step (actions/setup-go,
      # dtolnay/rust-toolchain, etc.) once the core language is chosen.

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        run: make lint
